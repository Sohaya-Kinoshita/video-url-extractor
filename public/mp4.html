<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MP4で視聴・保存 | Video URL Extractor</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="intro" aria-labelledby="page-title">
        <div class="page-nav">
          <p class="eyebrow">Video URL Extractor</p>
          <a class="nav-link" href="/">抽出ページへ</a>
        </div>
        <h1 id="page-title">MP4で視聴・保存</h1>
        <p class="lead">画質を変えずにMP4を準備します。完了までこのページを開いてお待ちください。</p>
      </section>
      <section class="tool-panel mp4-panel" aria-label="MP4プレーヤー">
        <p id="mp4-status" class="status" role="status" aria-live="polite">動画情報を取得しています…</p>
        <progress id="mp4-progress" max="100" value="0" aria-label="MP4の準備状況"></progress>
        <video id="mp4-video" controls playsinline preload="auto" hidden></video>
        <div class="mp4-actions">
          <a id="mp4-save" class="download-link" hidden>MP4を保存</a>
          <button id="mp4-cancel" type="button" class="copy-button">中止</button>
          <button id="mp4-retry" type="button" hidden>再試行</button>
          <a id="mp4-original" class="nav-link" target="_blank" rel="noopener noreferrer" hidden>元のURLから開く</a>
        </div>
        <p class="mp4-note">MP4の準備には動画全体の通信量がかかります。保存できない場合は「MP4を保存」をもう一度押してください。</p>
      </section>
      <p class="last-updated">最終更新: 2026-10-24 14:02 JST</p>
    </main>
    <script type="module" src="/mp4.js?v=2"></script>
  </body>
</html>
