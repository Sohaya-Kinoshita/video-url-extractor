<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>保存済み動画URL - Video URL Extractor</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="intro" aria-labelledby="page-title">
        <div class="page-nav">
          <p class="eyebrow">Video URL Extractor</p>
          <a class="nav-link" href="/">抽出ページへ</a>
        </div>
        <h1 id="page-title">保存済み動画URL</h1>
        <p class="lead">
          「開く」ボタンを押した動画URLを、この端末のブラウザ内に保存しています。
        </p>
      </section>

      <section class="results-section" aria-labelledby="saved-title">
        <div class="results-header">
          <h2 id="saved-title">保存リスト</h2>
          <span id="saved-count" class="count">0件</span>
        </div>
        <div id="saved-results" class="results empty">
          <p>保存済みURLはありません。</p>
        </div>
      </section>

      <p class="last-updated">最終更新: 2026-09-09 09:49 JST</p>
    </main>

    <script src="/storage.js"></script>
    <script src="/saved.js" defer></script>
  </body>
</html>
