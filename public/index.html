<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Video URL Extractor</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="intro" aria-labelledby="page-title">
        <div class="page-nav">
          <p class="eyebrow">Video URL Extractor</p>
          <a class="nav-link" href="/saved.html">保存リストへ</a>
        </div>
        <h1 id="page-title">Webページ内の動画URLを抽出</h1>
        <p class="lead">
          ページURLを入力すると、HTML内の <span>.mp4</span> や <span>.m3u8</span>、
          video/sourceタグ、埋め込みURLを検出して一覧表示します。
        </p>
      </section>

      <section class="tool-panel" aria-label="抽出フォーム">
        <form id="extract-form" class="extract-form">
          <label for="page-url">解析するWebページURL</label>
          <div class="input-row">
            <input
              id="page-url"
              name="url"
              type="url"
              inputmode="url"
              placeholder="https://example.com/video-page"
              autocomplete="url"
              required
            />
            <button type="button" id="paste-button" class="paste-button">ペースト</button>
            <button type="submit" id="submit-button">探索</button>
          </div>
          <label class="checkbox-row" for="scan-linked-pages">
            <input id="scan-linked-pages" type="checkbox" checked />
            <span>リンク先ページも探索</span>
          </label>
        </form>

        <div id="status" class="status" role="status" aria-live="polite"></div>
      </section>

      <section class="results-section" aria-labelledby="results-title">
        <div class="results-header">
          <h2 id="results-title">抽出結果</h2>
          <span id="result-count" class="count">0件</span>
        </div>
        <div id="results" class="results empty">
          <p>まだ解析結果はありません。</p>
        </div>
      </section>

      <p class="last-updated">最終更新: 2026-09-11 14:17 JST</p>
    </main>

    <script src="/storage.js"></script>
    <script src="/app.js" defer></script>
  </body>
</html>
