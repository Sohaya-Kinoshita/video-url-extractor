<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>抽出履歴 - Video URL Extractor</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="intro">
        <div class="page-nav">
          <p class="eyebrow">Video URL Extractor</p>
          <nav class="nav-group" aria-label="ページ移動">
            <a class="nav-link" href="/">抽出ページへ</a>
            <a class="nav-link" href="/saved.html">保存リストへ</a>
            <button type="button" class="logout-button" data-logout>ログアウト</button>
          </nav>
        </div>
        <h1>抽出履歴</h1>
        <p class="lead">探索したページを記録しています。「再探索」で最新の動画URLを取得できます。</p>
      </section>
      <p id="history-status" class="status" role="status"></p>
      <section class="results-section" aria-label="抽出履歴">
        <div id="history-results" class="results empty"><p>履歴を読み込んでいます…</p></div>
      </section>
      <button id="history-more" class="load-more" type="button" hidden>さらに表示</button>
      <p class="last-updated">最終更新: 2026-10-24 15:28 JST</p>
    </main>
    <script src="/storage.js"></script>
    <script src="/private.js" defer></script>
    <script src="/history.js" defer></script>
  </body>
</html>
