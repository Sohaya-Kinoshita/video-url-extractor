<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>保存済み動画URL - Video URL Extractor</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="intro" aria-labelledby="page-title">
        <div class="page-nav">
          <p class="eyebrow">Video URL Extractor</p>
          <nav class="nav-group" aria-label="ページ移動">
            <a class="nav-link" href="/">抽出ページへ</a>
            <a class="nav-link" href="/history.html">抽出履歴へ</a>
          </nav>
        </div>
        <h1 id="page-title">保存済み動画URL</h1>
        <p class="lead">
          「記憶」した動画URLを自分専用の保存リストに保管します。同じパスワードで別の端末からも確認できます。
        </p>
      </section>

      <button type="button" id="import-local" hidden>この端末の保存リストを取り込む</button>
      <p id="saved-status" class="status" role="status" aria-live="polite"></p>
      <section class="results-section" aria-labelledby="saved-title">
        <div class="results-header">
          <h2 id="saved-title">保存リスト</h2>
          <span id="saved-count" class="count">0件</span>
        </div>
        <div id="saved-results" class="results empty">
          <p>保存済みURLはありません。</p>
        </div>
      </section>
      <button type="button" id="saved-more" class="load-more" hidden>さらに表示</button>

      <footer class="page-footer">
        <p class="last-updated">最終更新: 2026-10-24 16:45 JST</p>
        <button type="button" class="logout-button" data-logout>ログアウト</button>
      </footer>
    </main>

    <script src="/storage.js"></script>
    <script src="/private.js" defer></script>
    <script src="/saved.js" defer></script>
  </body>
</html>
