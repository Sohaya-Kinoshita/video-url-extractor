<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MP4で視聴・保存 | Video URL Extractor</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="intro" aria-labelledby="page-title">
        <div class="page-nav">
          <p class="eyebrow">Video URL Extractor</p>
          <nav class="nav-group" aria-label="ページ移動">
            <a class="nav-link" href="/">抽出ページへ</a>
            <a class="nav-link" href="/saved.html">保存リストへ</a>
          </nav>
        </div>
        <h1 id="page-title">MP4で視聴・保存</h1>
        <p class="lead">「変換スタート」を押すと、画質を変えずにMP4に変換します。変換中はこのページを開いてお待ちください。</p>
      </section>
      <section class="tool-panel mp4-panel" aria-label="MP4プレーヤー">
        <p id="mp4-status" class="status" role="status" aria-live="polite">変換する動画URLを確認しています…</p>
        <progress id="mp4-progress" max="100" value="0" aria-label="MP4の準備状況" hidden></progress>
        <video id="mp4-video" controls playsinline preload="auto" hidden></video>
        <div class="mp4-actions">
          <a id="mp4-save" class="download-link" hidden>MP4を保存</a>
          <button id="mp4-start" type="button" hidden>変換スタート</button>
          <button id="mp4-cancel" type="button" class="copy-button" hidden>中止</button>
          <a id="mp4-original" class="nav-link" target="_blank" rel="noopener noreferrer" hidden>元のURLから開く</a>
        </div>
        <p class="mp4-note">MP4の準備には動画全体の通信量がかかります。保存できない場合は「MP4を保存」をもう一度押してください。</p>
      </section>
      <footer class="page-footer">
        <p class="last-updated">最終更新: 2026-10-24 18:59 JST</p>
        <button type="button" class="logout-button" data-logout>ログアウト</button>
      </footer>
    </main>
    <script src="/storage.js"></script>
    <script src="/private.js" defer></script>
    <script type="module" src="/mp4.js?v=3"></script>
  </body>
</html>
